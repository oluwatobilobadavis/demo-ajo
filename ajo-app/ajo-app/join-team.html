<!doctype html><html lang="en"><head><title>Join an Ajo team — AJO</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4bdb"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body class="auth"><div class="box">
<a class="logo" style="justify-content:center;margin-bottom:22px" href="index.html"><i class="fa-solid fa-people-group"></i>AJO</a>
<h1>Join an Ajo team</h1><p class="sub">You will join as a member</p>
<form id="f" novalidate><label for="c">Invitation code</label><input id="c" value="ABX72K" required><label for="n">Full name</label><input id="n" placeholder="David Oluwatobi" required><label for="e">Email</label><input id="e" type="email" required><label for="p">Password</label><input id="p" type="password" minlength="6" required><button class="btn block" style="margin-top:24px">Join as member</button></form>
<div class="or">or</div><button class="btn line block" type="button" onclick="toast('Google sign-in connects when the backend is ready')"><i class="fa-brands fa-google"></i> Continue with Google</button>
<p class="or">Have an account? <a href="login.html" style="color:var(--p);font-weight:700">Sign in</a></p></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{$('#f').onsubmit=e=>{e.preventDefault();if(!$('#n').value||!$('#e').value||$('#p').value.length<6)return toast('Fill every field. Password needs 6+ characters',1);S.user={role:'member',name:$('#n').value,username:$('#n').value.split(' ')[0].toLowerCase(),email:$('#e').value};save();location.href='member/dashboard.html'}});
</script></body></html>
