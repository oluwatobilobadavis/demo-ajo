<!doctype html><html lang="en"><head><title>Welcome back! 👋 — AJO</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4bdb"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body class="auth"><div class="box">
<a class="logo" style="justify-content:center;margin-bottom:22px" href="index.html"><i class="fa-solid fa-people-group"></i>AJO</a>
<h1>Welcome back! 👋</h1><p class="sub">Please enter your details to sign in</p>
<form id="f" novalidate><label for="e">Email</label><input id="e" type="email" autocomplete="email" placeholder="you@example.com" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Enter your password" required><label for="r">Sign in as</label><select id="r"><option value="admin">Admin (demo)</option><option value="member">Member (demo)</option></select><p style="text-align:center"><a href="forgot-password.html" style="font-weight:700">Reset your password</a></p><button class="btn block" style="margin-top:24px">Sign in</button></form>
<div class="or">or</div><button class="btn line block" type="button" onclick="toast('Google sign-in connects when the backend is ready')"><i class="fa-brands fa-google"></i> Continue with Google</button>
<p class="or">New here? <a href="register.html" style="color:var(--p);font-weight:700">Create an account</a> · <a href="join-team.html" style="color:var(--p);font-weight:700">Join a team</a></p></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{$('#f').onsubmit=e=>{e.preventDefault();if(!$('#e').value||!$('#p').value)return toast('Enter your email and password',1);const r=$('#r').value;S.user={role:r,name:r==='admin'?'Adebayo Ogunleye':'David Oluwatobi',username:r==='admin'?'adebayo':'david',email:$('#e').value};save();location.href=r+'/dashboard.html'}});
</script></body></html>
