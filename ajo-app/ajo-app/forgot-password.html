<!doctype html><html lang="en"><head><title>Reset your password — AJO</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4bdb"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body class="auth"><div class="box">
<a class="logo" style="justify-content:center;margin-bottom:22px" href="index.html"><i class="fa-solid fa-people-group"></i>AJO</a>
<h1>Reset your password</h1><p class="sub">We will email you a reset link</p>
<form id="f" novalidate><label for="e">Email</label><input id="e" type="email" placeholder="you@example.com" required><button class="btn block" style="margin-top:24px">Send reset link</button></form>
<div class="or">or</div><button class="btn line block" type="button" onclick="toast('Google sign-in connects when the backend is ready')"><i class="fa-brands fa-google"></i> Continue with Google</button>
<p class="or"><a href="login.html" style="color:var(--p);font-weight:700">Back to sign in</a></p></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{$('#f').onsubmit=e=>{e.preventDefault();$('#e').value?toast('Reset link sent (demo)'):toast('Enter your email',1)}});
</script></body></html>
